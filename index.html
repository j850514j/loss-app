<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>減脂記錄</title>
<meta name="theme-color" content="#1F3D2B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iansui:wght@400&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --ink:#1F3D2B;
    --paper:#F5F6F0;
    --card:#FFFFFF;
    --line:#DEE3D4;
    --muted:#6B7566;
    --alert:#C1443D;
    --alert-soft:#F5DEDC;
    --ok:#4C7A55;
    --ok-soft:#DEEBDF;
    --radius:14px;
    --hand:'Iansui', cursive;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
    background-image:repeating-linear-gradient(to bottom, transparent, transparent 31px, rgba(31,61,43,0.05) 32px);
  }
  h1,h2,h3{
    font-family:var(--hand),Georgia,"Noto Serif TC",serif;
    font-weight:400;
    margin:0;
  }
  .num{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }
  header.top{
    padding:20px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  header.top h1{font-size:26px;letter-spacing:0.02em;transform:rotate(-1.2deg);display:inline-block;}
  header.top .date{font-size:13px;color:var(--muted);}

  main{
    flex:1;
    overflow-y:auto;
    padding:0 16px 100px;
    max-width:480px;
    width:100%;
    margin:0 auto;
  }

  .page{display:none;}
  .page.active{display:block;}

  /* ---- 3D floating card ---- */
  @keyframes floatIn{
    0%  { opacity:0; transform:translateY(22px) scale(0.96); }
    60% { opacity:1; transform:translateY(-3px) scale(1.005); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .sugar-card{
    background:linear-gradient(155deg,#ffffff 55%,#f3f6f0 100%);
    border:none;
    border-radius:20px;
    padding:20px 20px 18px;
    margin-bottom:18px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.95) inset,
      0 -1px 0 rgba(31,61,43,0.06) inset,
      0 4px 0 #d5ddd0,
      0 8px 20px rgba(31,61,43,0.10),
      0 2px 6px rgba(31,61,43,0.07);
    animation: floatIn .5s cubic-bezier(0.34,1.2,0.64,1) both;
    position:relative;
  }
  .sugar-card::before{
    content:'';
    position:absolute;
    top:0; left:16px; right:16px; height:1px;
    background:rgba(255,255,255,0.9);
    border-radius:99px;
  }
  .sugar-card:nth-child(1){ animation-delay:.05s; }
  .sugar-card:nth-child(2){ animation-delay:.15s; }
  .sugar-card .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
  }
  .sugar-card .label{font-size:14px;color:var(--muted);}
  .sugar-card .amount{font-size:28px;letter-spacing:-0.01em;}
  .sugar-card .amount span{font-size:14px;color:var(--muted);font-family:inherit;}

  /* 3D capsule gauge */
  .gauge-track{
    height:14px;
    border-radius:99px;
    background:linear-gradient(to bottom,#dde4d7,#eaede6);
    box-shadow:0 3px 6px rgba(31,61,43,0.12) inset, 0 1px 0 rgba(255,255,255,0.8);
    overflow:visible;
    position:relative;
  }
  .gauge-fill{
    height:100%;
    border-radius:99px;
    background:linear-gradient(to bottom,#7bc27e 0%,#4C7A55 55%,#3a6044 100%);
    box-shadow:0 2px 8px rgba(76,122,85,0.45), 0 1px 0 rgba(255,255,255,0.25) inset;
    transition:width .55s cubic-bezier(0.34,1.2,0.64,1), background .4s ease;
    position:relative;
    overflow:hidden;
  }
  .gauge-fill::after{
    content:'';
    position:absolute;
    top:2px; left:8px; right:8px; height:4px;
    border-radius:99px;
    background:rgba(255,255,255,0.32);
  }
  .gauge-fill.warn{
    background:linear-gradient(to bottom,#e0726c 0%,#C1443D 55%,#9e342d 100%);
    box-shadow:0 2px 8px rgba(193,68,61,0.45), 0 1px 0 rgba(255,255,255,0.25) inset;
  }

  /* ---- 3D Capture button ---- */
  .capture-btn{
    width:100%;
    border:none;
    border-radius:var(--radius);
    background:linear-gradient(to bottom,#2a5038 0%,#1F3D2B 60%,#162d1f 100%);
    color:var(--paper);
    padding:17px;
    font-size:18px;
    font-family:var(--hand),inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
    cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.12) inset,
      0 5px 0 #0f1f13,
      0 8px 18px rgba(15,31,19,0.35);
    transform:translateY(0);
    transition:transform .1s ease, box-shadow .1s ease;
    position:relative;
  }
  .capture-btn:active{
    transform:translateY(4px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.12) inset,
      0 1px 0 #0f1f13,
      0 3px 8px rgba(15,31,19,0.25);
  }
  .capture-btn.ghost-btn{
    background:linear-gradient(to bottom,#ffffff,#f5f5f2);
    color:var(--ink);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 5px 0 #c8cec3,
      0 8px 18px rgba(31,61,43,0.12);
  }
  .capture-btn.ghost-btn:active{
    transform:translateY(4px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 1px 0 #c8cec3,
      0 3px 8px rgba(31,61,43,0.08);
  }
  .capture-btn svg{width:22px;height:22px;flex-shrink:0;}

  input[type=file]{display:none;}

  /* ---- 3D hero banner ---- */
  @keyframes heroFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }
  .hero-3d{
    text-align:center;
    margin:-4px 0 10px;
    animation:floatIn .6s cubic-bezier(0.34,1.2,0.64,1) both;
  }
  .hero-plate{
    display:inline-block;
    position:relative;
    animation:heroFloat 4s ease-in-out infinite;
    filter:drop-shadow(0 12px 18px rgba(31,61,43,0.18)) drop-shadow(0 4px 6px rgba(31,61,43,0.12));
  }
  .plate-svg{
    width:200px;
    height:auto;
    display:block;
  }
  .hero-label{
    font-family:var(--hand),inherit;
    font-size:17px;
    color:var(--muted);
    margin-top:2px;
    letter-spacing:0.02em;
  }

  /* ---- Log list ---- */
  .section-title{
    font-family:var(--hand),inherit;
    font-size:16px;
    color:var(--muted);
    margin:4px 0 10px;
  }
  .entry{
    background:linear-gradient(155deg,#ffffff 60%,#f7f9f5 100%);
    border:none;
    border-left:4px solid var(--ok);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    box-shadow:
      0 3px 0 #d4ddd0,
      0 5px 14px rgba(31,61,43,0.08),
      0 1px 3px rgba(31,61,43,0.05);
    animation:floatIn .4s cubic-bezier(0.34,1.2,0.64,1) both;
  }
  .entry.high-sugar{border-left-color:var(--alert);}
  .entry .meta{flex:1;min-width:0;}
  .entry .food{font-family:var(--hand),inherit;font-size:17px;margin-bottom:4px;}
  .entry .time{font-size:12px;color:var(--muted);}
  .entry .stats{
    text-align:right;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }
  .entry .stats .kcal{color:var(--ink);}
  .entry .del{
    background:none;border:none;color:var(--muted);
    font-size:18px;line-height:1;cursor:pointer;padding:0 0 0 8px;
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    font-size:14px;
  }

  /* ---- Loading / modal ---- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(31,61,43,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card);
    width:100%;
    max-width:480px;
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:85vh;
    overflow-y:auto;
  }
  .sheet h2{font-size:18px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input, .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
  }
  .sheet-preview{
    width:100%;
    max-height:180px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:16px;
    background:var(--line);
  }
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-size:16px;
    font-family:var(--hand),inherit;
    cursor:pointer;
  }
  .btn.primary{background:var(--ink);color:var(--paper);}
  .btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);}

  .link-btn{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--hand),inherit;
    font-size:15px;
    text-decoration:underline;
    padding:0 0 20px;
    text-align:center;
    cursor:pointer;
  }

  @keyframes popIn{
    0%{ transform:scale(0.5) translateY(6px); opacity:0; }
    65%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
  .badge-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:-8px 0 18px;
  }
  .badge{
    background:var(--ok-soft);
    color:var(--ink);
    border-radius:999px;
    padding:6px 13px;
    font-size:13px;
    font-family:var(--hand),inherit;
    display:inline-flex;
    align-items:center;
    gap:4px;
    animation:popIn .35s ease;
    white-space:nowrap;
  }

  .toast{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 14px);
    left:50%;
    transform:translateX(-50%) scale(0.85);
    background:var(--ink);
    color:var(--paper);
    padding:10px 20px;
    border-radius:999px;
    font-family:var(--hand),inherit;
    font-size:16px;
    opacity:0;
    pointer-events:none;
    z-index:80;
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
    box-shadow:0 6px 18px rgba(31,61,43,0.25);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }

  .chart-wrap{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 10px 8px;
    margin-bottom:18px;
  }
  .chart-wrap svg{width:100%;height:130px;display:block;}
  .chart-empty{
    text-align:center;
    color:var(--muted);
    font-family:var(--hand),inherit;
    font-size:15px;
    padding:34px 10px;
  }

  /* ---- Color food strip (home + result) ---- */
  .color-strip-wrap{
    margin: 0 0 20px;
    animation:floatIn .5s cubic-bezier(0.34,1.2,0.64,1) both;
    animation-delay:.25s;
  }
  .color-strip-title{
    font-family:var(--hand),inherit;
    font-size:15px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .color-strip{
    display:flex;
    height:24px;
    border-radius:99px;
    overflow:hidden;
    box-shadow:0 3px 8px rgba(31,61,43,0.13) inset, 0 1px 0 rgba(255,255,255,0.6);
    background:var(--line);
    position:relative;
  }
  .color-segment{
    flex-shrink:0;
    position:relative;
    overflow:hidden;
    transition:flex .6s cubic-bezier(0.34,1.2,0.64,1);
    min-width:6px;
  }
  .color-segment::after{
    content:'';
    position:absolute;
    top:3px;left:6px;right:6px;height:5px;
    border-radius:99px;
    background:rgba(255,255,255,0.28);
  }
  .color-dominant{
    font-family:var(--hand),inherit;
    font-size:14px;
    color:var(--muted);
    margin-top:7px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .color-dominant-dot{
    width:10px;height:10px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow:0 1px 4px rgba(0,0,0,0.18);
  }

  /* ---- Result sheet (after saving) ---- */
  .result-hero{
    text-align:center;
    padding:6px 0 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .result-food-name{
    font-family:var(--hand),inherit;
    font-size:21px;
    margin-bottom:4px;
    line-height:1.3;
  }
  .result-kcal{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:36px;
    letter-spacing:-0.02em;
    color:var(--ink);
    line-height:1;
  }
  .result-kcal small{
    font-size:14px;
    color:var(--muted);
    font-weight:400;
    letter-spacing:0;
  }
  .result-macro{margin-bottom:16px;}
  .result-macro-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:7px;
  }
  .result-macro-label{font-size:14px;color:var(--muted);}
  .result-macro-delta{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:20px;
    font-weight:600;
  }
  .result-macro-delta.p-delta{color:var(--ok);}
  .result-macro-delta.s-delta{color:#d4a030;}
  .result-macro-delta.s-over{color:var(--alert);}
  .result-bar-track{
    height:14px;
    border-radius:99px;
    background:linear-gradient(to bottom,#dde4d7,#eaede6);
    box-shadow:0 3px 6px rgba(31,61,43,0.12) inset, 0 1px 0 rgba(255,255,255,0.8);
    overflow:hidden;
    margin-bottom:5px;
    position:relative;
  }
  .result-bar-fill{
    height:100%;
    border-radius:99px;
    position:relative;
    overflow:hidden;
    width:0%;
    transition:width .7s cubic-bezier(0.34,1.1,0.64,1);
  }
  .result-bar-fill::after{
    content:'';position:absolute;
    top:2px;left:8px;right:8px;height:4px;
    border-radius:99px;background:rgba(255,255,255,0.32);
  }
  .result-bar-fill.pf{
    background:linear-gradient(to bottom,#7bc27e 0%,#4C7A55 55%,#3a6044 100%);
    box-shadow:0 2px 8px rgba(76,122,85,0.45);
  }
  .result-bar-fill.sf-ok{
    background:linear-gradient(to bottom,#f0c070 0%,#d4a030 55%,#b88020 100%);
    box-shadow:0 2px 8px rgba(212,160,48,0.4);
  }
  .result-bar-fill.sf-over{
    background:linear-gradient(to bottom,#e87070 0%,#C1443D 55%,#9e342d 100%);
    box-shadow:0 2px 8px rgba(193,68,61,0.45);
  }
  .result-macro-info{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
  }
  .result-macro-remain{color:var(--ink);}
  .result-macro-over{color:var(--alert);}
  .result-macro-done{color:var(--ok);}
  .week-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .week-row .day{font-family:var(--hand),inherit;font-size:16px;}
  .week-row .vals{font-size:13px;color:var(--muted);white-space:nowrap;}
  .week-row.over .vals{color:var(--alert);}

  .spinner-wrap{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:30px 10px 10px;
  }
  .spinner{
    width:34px;height:34px;
    border-radius:50%;
    border:3px solid var(--line);
    border-top-color:var(--ink);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner-wrap p{font-size:14px;color:var(--muted);margin:0;}

  /* ---- Settings page ---- */
  .settings-group{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 4px;
    margin-bottom:18px;
  }
  .settings-group h3{font-size:14px;margin-bottom:12px;}
  .hint{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:14px;line-height:1.5;}
  .save-msg{
    font-size:13px;color:var(--ok);height:18px;margin-top:2px;
  }

  .placeholder-page{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .placeholder-page h2{color:var(--ink);font-size:18px;margin-bottom:8px;}
  .placeholder-page p{font-size:14px;line-height:1.6;}

  /* ---- Bottom nav ---- */
  nav.bottom{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:20;
  }
  nav.bottom button{
    flex:1;
    background:none;
    border:none;
    padding:12px 4px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:var(--muted);
    cursor:pointer;
    font-size:11px;
    font-family:inherit;
  }
  nav.bottom button svg{width:22px;height:22px;}
  nav.bottom button.active{color:var(--ink);}
</style>
</head>
<body>

<header class="top">
  <h1>減脂記錄</h1>
  <div class="date num" id="todayLabel"></div>
</header>

<div style="padding:0 20px 6px;max-width:480px;margin:0 auto;">
  <svg viewBox="0 0 400 120" style="width:100%;height:auto;max-height:110px;display:block;" xmlns="http://www.w3.org/2000/svg">
    <!-- steam -->
    <path d="M150,34 Q145,24 152,16 Q159,8 154,0" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M172,34 Q167,22 175,14 Q183,6 177,-2" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round" transform="translate(0,4)"/>
    <!-- bowl -->
    <path d="M118,44 Q112,44 113,50 Q117,86 160,88 Q203,86 207,50 Q208,44 202,44 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="160" cy="44" rx="47" ry="7" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
    <circle cx="145" cy="45" r="4" fill="var(--ok)"/>
    <circle cx="163" cy="47" r="4" fill="var(--alert)"/>
    <circle cx="178" cy="44" r="4" fill="var(--ok)"/>
    <!-- little sprout leaf on the bowl -->
    <path d="M158,44 Q158,30 170,26 Q162,38 158,44Z" fill="var(--ok)" opacity="0.85"/>
    <!-- apple -->
    <path d="M280,42 Q266,42 263,58 Q260,78 278,86 Q292,92 300,86 Q318,78 315,58 Q312,42 298,42 Q289,36 280,42Z" fill="var(--card)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M289,42 Q290,32 298,28" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <path d="M296,30 Q305,26 310,32 Q302,32 296,30Z" fill="var(--ok)"/>
    <circle cx="284" cy="60" r="3" fill="var(--alert)" opacity="0.55"/>
    <!-- scatter crumbs -->
    <circle cx="90" cy="90" r="3" fill="var(--muted)" opacity="0.4"/>
    <circle cx="330" cy="78" r="3" fill="var(--muted)" opacity="0.4"/>
    <circle cx="105" cy="72" r="2" fill="var(--muted)" opacity="0.3"/>
    <circle cx="340" cy="60" r="2" fill="var(--muted)" opacity="0.3"/>
  </svg>
</div>

<main>

  <!-- 飲食紀錄頁 -->
  <section class="page active" id="page-log">

    <!-- 3D hero banner -->
    <div class="hero-3d" aria-hidden="true">
      <div class="hero-plate">
        <div class="hero-shadow"></div>
        <svg class="plate-svg" viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg">
          <!-- plate base (isometric-ish ellipse) -->

<!-- 辨識中 / 確認結果 sheet -->
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEYS = {
    entries: "fatloss_entries_v1",
    apiUrl: "fatloss_api_url_v1",
    sugarLimit: "fatloss_sugar_limit_v1",
    proteinGoal: "fatloss_protein_goal_v1",
    measures: "fatloss_measures_v1"
  };

  function loadMeasures(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.measures) || "{}");
    }catch(e){ return {}; }
  }
  function saveMeasure(dateKey, weight, fat){
    var all = loadMeasures();
    all[dateKey] = { weight: weight, fat: fat };
    localStorage.setItem(STORAGE_KEYS.measures, JSON.stringify(all));
  }
  function measuresSorted(){
    var all = loadMeasures();
    return Object.keys(all).sort().map(function(k){
      return { date: k, weight: all[k].weight, fat: all[k].fat };
    });
  }

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function loadEntries(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.entries) || "{}");
    }catch(e){ return {}; }
  }
  function saveEntries(all){
    localStorage.setItem(STORAGE_KEYS.entries, JSON.stringify(all));
  }
  function getTodayEntries(){
    var all = loadEntries();
    return all[todayKey()] || [];
  }
  function addEntry(entry, dateKey){
    var all = loadEntries();
    var key = dateKey || todayKey();
    if(!all[key]) all[key] = [];
    all[key].unshift(entry);
    saveEntries(all);
  }
  function deleteEntry(id){
    var all = loadEntries();
    var key = todayKey();
    if(!all[key]) return;
    all[key] = all[key].filter(function(e){ return e.id !== id; });
    saveEntries(all);
  }

  function getSugarLimit(){
    var v = parseFloat(localStorage.getItem(STORAGE_KEYS.sugarLimit));
    return isNaN(v) ? 25 : v;
  }
  function getProteinGoal(){
    var v = parseFloat(localStorage.getItem(STORAGE_KEYS.proteinGoal));
    return isNaN(v) ? 90 : v;
  }
  function getApiUrl(){
    return localStorage.getItem(STORAGE_KEYS.apiUrl) || "";
  }

  function dateKeyFromDateObj(date){
    return date.getFullYear() + "-" + String(date.getMonth()+1).padStart(2,"0") + "-" + String(date.getDate()).padStart(2,"0");
  }

  function computeSugarStreak(){
    var all = loadEntries();
    var limit = getSugarLimit();
    var streak = 0;
    var d = new Date();
    while(true){
      var key = dateKeyFromDateObj(d);
      var dayEntries = all[key];
      if(!dayEntries || dayEntries.length === 0) break;
      var total = dayEntries.reduce(function(s,e){ return s + (Number(e.sugar_g)||0); }, 0);
      if(total > limit) break;
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function renderBadges(){
    var entries = getTodayEntries();
    var badges = [];
    if(entries.length > 0){
      var totalSugar = entries.reduce(function(s,e){ return s + (Number(e.sugar_g)||0); }, 0);
      var totalProtein = entries.reduce(function(s,e){ return s + (Number(e.protein_g)||0); }, 0);
      var limit = getSugarLimit();
      var goal = getProteinGoal();
      if(totalSugar <= limit) badges.push("🎯 糖分達標");
      if(totalSugar === 0) badges.push("🍎 零添加糖");
      if(totalProtein >= goal) badges.push("💪 蛋白質達標");
      var streak = computeSugarStreak();
      if(streak >= 2) badges.push("🔥 連續 " + streak + " 天控糖");
    }
    var row = document.getElementById("badgeRow");
    if(badges.length === 0){
      row.style.display = "none";
      row.innerHTML = "";
      return;
    }
    row.style.display = "flex";
    row.innerHTML = badges.map(function(b){ return '<span class="badge">' + b + '</span>'; }).join("");
  }

  var CELEBRATE_MESSAGES = ["✏️ 記上一筆！", "📝 收到，記好了！", "✅ 這餐記好了", "🎉 又完成一筆紀錄", "👍 好，寫進小本本了"];
  function showToast(text){
    var toast = document.getElementById("toast");
    toast.textContent = text || CELEBRATE_MESSAGES[Math.floor(Math.random()*CELEBRATE_MESSAGES.length)];
    toast.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function(){ toast.classList.remove("show"); }, 1400);
  }

  // ---------- render ----------
  function renderDate(){
    var d = new Date();
    var wk = ["日","一","二","三","四","五","六"][d.getDay()];
    document.getElementById("todayLabel").textContent =
      d.getMonth()+1 + "/" + d.getDate() + " (週" + wk + ")";
  }

  function renderSugar(){
    var entries = getTodayEntries();
    var total = entries.reduce(function(sum, e){ return sum + (Number(e.sugar_g)||0); }, 0);
    var limit = getSugarLimit();
    document.getElementById("sugarToday").textContent = Math.round(total*10)/10;
    document.getElementById("sugarLimit").textContent = limit;
    var pct = limit > 0 ? Math.min(100, (total/limit)*100) : 0;
    var fill = document.getElementById("sugarGauge");
    fill.style.width = pct + "%";
    fill.classList.toggle("warn", total > limit);

    var msgEl = document.getElementById("sugarMsg");
    var ratio = limit > 0 ? total / limit : 0;
    var msg;
    if(entries.length === 0){
      msg = "今天還沒記錄，先拍張照開始吧";
    }else if(total > limit){
      msg = "欸，糖分已經超標囉，明天再拉回來就好，別給自己太大壓力";
    }else if(ratio >= 0.8){
      msg = "快到今天的額度了，晚一點的餐盡量清淡一點";
    }else if(ratio >= 0.5){
      msg = "吃到一半的量了，還有空間，維持這個節奏";
    }else{
      msg = "目前控制得不錯，繼續保持";
    }
    msgEl.textContent = msg;
  }

  function renderProtein(){
    var entries = getTodayEntries();
    var total = entries.reduce(function(sum, e){ return sum + (Number(e.protein_g)||0); }, 0);
    var goal = getProteinGoal();
    document.getElementById("proteinToday").textContent = Math.round(total*10)/10;
    document.getElementById("proteinGoal").textContent = goal;
    var pct = goal > 0 ? Math.min(100, (total/goal)*100) : 0;
    document.getElementById("proteinGauge").style.width = pct + "%";

    var msgEl = document.getElementById("proteinMsg");
    var ratio = goal > 0 ? total / goal : 0;
    var msg;
    if(entries.length === 0){
      msg = "今天的蛋白質還沒開始記錄";
    }else if(ratio >= 1){
      msg = "蛋白質達標了，很讚";
    }else if(ratio >= 0.6){
      msg = "快到目標了，再加一份蛋白質來源";
    }else{
      msg = "蛋白質攝取還不夠，找機會補一點";
    }
    msgEl.textContent = msg;
  }

  function renderEntries(){
    var entries = getTodayEntries();
    var list = document.getElementById("entryList");
    list.innerHTML = "";
    if(entries.length === 0){
      list.innerHTML = '<div class="empty-state">還沒紀錄，拍張照開始吧</div>';
      return;
    }
    entries.forEach(function(e){
      var row = document.createElement("div");
      row.className = "entry" + (Number(e.sugar_g) >= 10 ? " high-sugar" : "");
      row.innerHTML =
        '<div class="meta">' +
          '<div class="food">' + escapeHtml(e.food_name) + '</div>' +
          '<div class="time">' + e.time + (e.note ? " · " + escapeHtml(e.note) : "") + '</div>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="kcal num">' + (e.calories!=null ? e.calories + " kcal" : "—") + '</div>' +
          '<div class="num">蛋 ' + (e.protein_g!=null ? e.protein_g + "g" : "—") + ' · 糖 ' + (e.sugar_g!=null ? e.sugar_g + "g" : "—") + '</div>' +
        '</div>' +
        '<button class="del" data-id="' + e.id + '" aria-label="刪除">×</button>';
      list.appendChild(row);
    });
    list.querySelectorAll(".del").forEach(function(btn){
      btn.addEventListener("click", function(){
        deleteEntry(btn.getAttribute("data-id"));
        renderEntries();
        renderSugar();
        renderProtein();
        renderBadges();
      });
    });
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  // ---------- navigation ----------
  document.querySelectorAll("nav.bottom button").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll("nav.bottom button").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
      var target = btn.getAttribute("data-page");
      document.getElementById("page-" + target).classList.add("active");
      if(target === "trend") renderTrend();
    });
  });

  // ---------- settings ----------
  function loadSettingsForm(){
    document.getElementById("apiUrlInput").value = getApiUrl();
    document.getElementById("sugarLimitInput").value = getSugarLimit();
    document.getElementById("proteinGoalInput").value = getProteinGoal();
  }
  document.getElementById("saveSettingsBtn").addEventListener("click", function(){
    var url = document.getElementById("apiUrlInput").value.trim();
    var limit = parseFloat(document.getElementById("sugarLimitInput").value);
    var goal = parseFloat(document.getElementById("proteinGoalInput").value);
    localStorage.setItem(STORAGE_KEYS.apiUrl, url);
    localStorage.setItem(STORAGE_KEYS.sugarLimit, isNaN(limit) ? 25 : limit);
    localStorage.setItem(STORAGE_KEYS.proteinGoal, isNaN(goal) ? 90 : goal);
    renderSugar();
    renderProtein();
    renderBadges();
    var msg = document.getElementById("saveMsg");
    msg.textContent = "已儲存";
    setTimeout(function(){ msg.textContent = ""; }, 1800);
  });

  // ---------- capture & recognition ----------
  var overlay = document.getElementById("overlay");
  var fileInput = document.getElementById("fileInput");
  var libraryInput = document.getElementById("libraryInput");

  document.getElementById("captureBtn").addEventListener("click", function(){
    if(!getApiUrl()){
      alert("請先到「設定」頁貼上你的 Apps Script 網址，才能使用拍照辨識。");
      return;
    }
    fileInput.click();
  });

  document.getElementById("libraryBtn").addEventListener("click", function(){
    if(!getApiUrl()){
      alert("請先到「設定」頁貼上你的 Apps Script 網址，才能使用拍照辨識。");
      return;
    }
    libraryInput.click();
  });

  document.getElementById("manualAddBtn").addEventListener("click", function(){
    showConfirmSheet({}, null);
  });

  function handleFileChosen(input){
    var file = input.files[0];
    if(!file) return;
    input.value = "";
    resizeImage(file, 1024, 0.8).then(function(dataUrl){
      var base64 = dataUrl.split(",")[1];
      recognizeFood(base64, "image/jpeg", dataUrl);
    }).catch(function(err){
      alert("讀取照片失敗：" + (err && err.message ? err.message : String(err)));
    });
  }

  fileInput.addEventListener("change", function(){ handleFileChosen(fileInput); });
  libraryInput.addEventListener("change", function(){ handleFileChosen(libraryInput); });

  function resizeImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      if(!file || !file.type || file.type.indexOf("image/") !== 0){
        reject(new Error("選到的檔案不是圖片格式（type: " + (file && file.type) + "）"));
        return;
      }
      var reader = new FileReader();
      reader.onerror = function(){
        reject(new Error("FileReader 讀取失敗：" + (reader.error ? reader.error.name : "未知錯誤")));
      };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){
          reject(new Error("圖片解碼失敗，檔案可能損毀或格式不支援"));
        };
        img.onload = function(){
          try{
            var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            var w = Math.round(img.width * scale);
            var h = Math.round(img.height * scale);
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          }catch(drawErr){
            reject(new Error("縮圖處理失敗：" + drawErr.message));
          }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function showLoading(){
    var loading = document.createElement("div");
    loading.className = "sheet";
    loading.innerHTML =
      '<div class="spinner-wrap">' +
        '<div class="spinner"></div>' +
        '<p>正在辨識這張照片…</p>' +
      '</div>';
    overlay.innerHTML = "";
    overlay.appendChild(loading);
    overlay.classList.add("show");
  }

  function recognizeFood(base64, mimeType, previewSrc){
    showLoading();
    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ controller.abort(); }, 25000);

    fetch(getApiUrl(), {
      method: "POST",
      body: JSON.stringify({ image: base64, mimeType: mimeType }),
      signal: controller.signal
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      clearTimeout(timeoutId);
      overlay.classList.remove("show");
      if(data.error){
        alert("辨識失敗：" + data.error);
        return;
      }
      showConfirmSheet(data, previewSrc);
    })
    .catch(function(err){
      clearTimeout(timeoutId);
      overlay.classList.remove("show");
      if(err && err.name === "AbortError"){
        alert("辨識逾時（超過 25 秒沒有回應），請確認 Apps Script 網址是否正確，或稍後再試一次。");
      }else{
        alert("連線失敗，請確認網址設定是否正確，或稍後再試一次。");
      }
    });
  }

  function formatDatetimeLocal(date){
    return date.getFullYear() + "-" + String(date.getMonth()+1).padStart(2,"0") + "-" + String(date.getDate()).padStart(2,"0") +
      "T" + String(date.getHours()).padStart(2,"0") + ":" + String(date.getMinutes()).padStart(2,"0");
  }

  function dateKeyFromDate(date){
    return date.getFullYear() + "-" + String(date.getMonth()+1).padStart(2,"0") + "-" + String(date.getDate()).padStart(2,"0");
  }

  function showConfirmSheet(result, previewSrc){
    result = result || {};
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.innerHTML =
      '<h2>' + (previewSrc ? "確認這餐的紀錄" : "手動新增紀錄") + '</h2>' +
      (previewSrc ? '<img class="sheet-preview" src="' + previewSrc + '">' : "") +
      '<div class="field"><label>日期與時間</label><input type="datetime-local" id="cf_datetime" value="' + formatDatetimeLocal(new Date()) + '"></div>' +
      '<div class="field"><label>食物名稱</label><input type="text" id="cf_name" value="' + escapeHtml(result.food_name || "") + '" placeholder="例如：滷肉飯"></div>' +
      '<div class="field"><label>估計熱量（kcal）</label><input type="number" id="cf_kcal" value="' + (result.calories != null ? result.calories : "") + '"></div>' +
      '<div class="field"><label>估計蛋白質（克）</label><input type="number" id="cf_protein" value="' + (result.protein_g != null ? result.protein_g : "") + '"></div>' +
      '<div class="field"><label>估計添加糖（克，天然水果/蔬菜/乳製品填 0）</label><input type="number" id="cf_sugar" value="' + (result.sugar_g != null ? result.sugar_g : "") + '"></div>' +
      '<div class="field"><label>備註（選填）</label><input type="text" id="cf_note" value="' + escapeHtml(result.note || "") + '"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn ghost" id="cf_cancel">取消</button>' +
        '<button class="btn primary" id="cf_save">儲存紀錄</button>' +
      '</div>';
    overlay.innerHTML = "";
    overlay.appendChild(sheet);
    overlay.classList.add("show");

    document.getElementById("cf_cancel").addEventListener("click", function(){
      overlay.classList.remove("show");
    });
    document.getElementById("cf_save").addEventListener("click", function(){
      var dtValue = document.getElementById("cf_datetime").value;
      var entryDate = dtValue ? new Date(dtValue) : new Date();
      if(isNaN(entryDate.getTime())) entryDate = new Date();
      var dateKey = dateKeyFromDate(entryDate);

      var newEntry = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        food_name: document.getElementById("cf_name").value.trim() || "未命名餐點",
        calories: numOrNull(document.getElementById("cf_kcal").value),
        protein_g: numOrNull(document.getElementById("cf_protein").value),
        sugar_g: numOrNull(document.getElementById("cf_sugar").value),
        note: document.getElementById("cf_note").value.trim(),
        time: String(entryDate.getHours()).padStart(2,"0") + ":" + String(entryDate.getMinutes()).padStart(2,"0")
      };

      addEntry(newEntry, dateKey);

      if(dateKey === todayKey()){
        renderEntries();
        renderSugar();
        renderProtein();
        renderBadges();
        renderColorStrip();
        showResultSheet(newEntry);
      }else{
        overlay.classList.remove("show");
        alert("已新增到 " + dateKey + " 的紀錄。目前清單只會顯示今天的紀錄，之後的「趨勢」頁會整合顯示歷史資料。");
      }
    });
  }

  function numOrNull(v){
    var n = parseFloat(v);
    return isNaN(n) ? null : Math.round(n*10)/10;
  }

  // ---------- food color strip ----------
  var FOOD_COLORS = [
    "#6DC27E","#F5A84E","#7BAEF5","#E07070",
    "#B97BEB","#F5D660","#5BC8D8","#F57BAA",
    "#A8D88A","#F5C0A0","#80C8C8","#C8A0F5"
  ];

  function buildColorStrip(entries){
    var valid = entries.filter(function(e){ return Number(e.calories) > 0; });
    var source = valid.length > 0 ? valid : entries;
    if(!source.length) return "";

    var total = source.reduce(function(s,e){ return s + (Number(e.calories)||1); }, 0);
    var maxCal = 0, dominant = null, dominantColor = "";

    var segHtml = source.map(function(e, i){
      var cal = Number(e.calories) || (total / source.length);
      var color = FOOD_COLORS[i % FOOD_COLORS.length];
      if(cal > maxCal){ maxCal = cal; dominant = e; dominantColor = color; }
      var flex = (cal / total * 100).toFixed(2);
      return '<div class="color-segment" style="flex:' + flex + ';background:' + color + '"></div>';
    }).join("");

    var domHtml = dominant
      ? '<div class="color-dominant">' +
          '<span class="color-dominant-dot" style="background:' + dominantColor + '"></span>' +
          '<span>今天最多的：' + escapeHtml(dominant.food_name) +
          (dominant.calories ? '（' + dominant.calories + ' kcal）' : '') + '</span>' +
        '</div>'
      : "";

    return '<div class="color-strip">' + segHtml + '</div>' + domHtml;
  }

  function renderColorStrip(){
    var wrap = document.getElementById("colorStripHome");
    var entries = getTodayEntries();
    if(!entries.length){
      wrap.style.display = "none";
      return;
    }
    wrap.style.display = "block";
    wrap.innerHTML = '<div class="color-strip-title">今日食物彩帶</div>' + buildColorStrip(entries);
  }

  // ---------- result sheet ----------
  function showResultSheet(entry){
    var entries = getTodayEntries();
    var sugarTotal = Math.round(entries.reduce(function(s,e){ return s+(Number(e.sugar_g)||0); },0)*10)/10;
    var proteinTotal = Math.round(entries.reduce(function(s,e){ return s+(Number(e.protein_g)||0); },0)*10)/10;
    var sugarLimit = getSugarLimit();
    var proteinGoal = getProteinGoal();
    var sugarOver = sugarTotal > sugarLimit;
    var proteinDone = proteinTotal >= proteinGoal;
    var proteinPct = Math.min(100, proteinGoal > 0 ? (proteinTotal/proteinGoal)*100 : 0).toFixed(1);
    var sugarPct = Math.min(100, sugarLimit > 0 ? (sugarTotal/sugarLimit)*100 : 0).toFixed(1);
    var dp = Math.round((Number(entry.protein_g)||0)*10)/10;
    var ds = Math.round((Number(entry.sugar_g)||0)*10)/10;
    var proteinRemain = Math.max(0, Math.round((proteinGoal - proteinTotal)*10)/10);
    var sugarRemain = Math.max(0, Math.round((sugarLimit - sugarTotal)*10)/10);
    var sugarExcess = Math.round((sugarTotal - sugarLimit)*10)/10;

    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.innerHTML =
      '<div class="result-hero">' +
        '<div class="result-food-name">' + escapeHtml(entry.food_name) + '</div>' +
        '<div class="result-kcal">' + (entry.calories != null ? entry.calories : "—") + '<small> kcal</small></div>' +
      '</div>' +

      '<div class="result-macro">' +
        '<div class="result-macro-header">' +
          '<span class="result-macro-label">蛋白質</span>' +
          '<span class="result-macro-delta p-delta">' + (dp > 0 ? "＋" + dp + "g" : "—") + '</span>' +
        '</div>' +
        '<div class="result-bar-track"><div class="result-bar-fill pf" id="res_pbar" style="width:0"></div></div>' +
        '<div class="result-macro-info">' +
          '<span>今天共 ' + proteinTotal + 'g</span>' +
          (proteinDone
            ? '<span class="result-macro-done">✓ 達標 ' + proteinTotal + '/' + proteinGoal + 'g</span>'
            : '<span class="result-macro-remain">還差 ' + proteinRemain + 'g</span>') +
        '</div>' +
      '</div>' +

      '<div class="result-macro">' +
        '<div class="result-macro-header">' +
          '<span class="result-macro-label">添加糖</span>' +
          '<span class="result-macro-delta ' + (sugarOver ? "s-over" : "s-delta") + '">' + (ds > 0 ? "＋" + ds + "g" : "—") + '</span>' +
        '</div>' +
        '<div class="result-bar-track"><div class="result-bar-fill ' + (sugarOver ? "sf-over" : "sf-ok") + '" id="res_sbar" style="width:0"></div></div>' +
        '<div class="result-macro-info">' +
          '<span>今天共 ' + sugarTotal + 'g</span>' +
          (sugarOver
            ? '<span class="result-macro-over">超標 ' + sugarExcess + 'g</span>'
            : '<span class="result-macro-remain">還剩 ' + sugarRemain + 'g 額度</span>') +
        '</div>' +
      '</div>' +

      '<div style="margin-bottom:18px;">' +
        '<div class="color-strip-title">今日食物彩帶</div>' +
        buildColorStrip(entries) +
      '</div>' +

      '<div class="sheet-actions">' +
        '<button class="btn primary" id="res_close" style="font-size:18px;">收工 ✓</button>' +
      '</div>';

    overlay.innerHTML = "";
    overlay.appendChild(sheet);
    overlay.classList.add("show");

    // Animate bars on next frame
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var pb = document.getElementById("res_pbar");
        var sb = document.getElementById("res_sbar");
        if(pb) pb.style.width = proteinPct + "%";
        if(sb) sb.style.width = sugarPct + "%";
      });
    });

    document.getElementById("res_close").addEventListener("click", function(){
      overlay.classList.remove("show");
    });
  }

  // ---------- trend page ----------
  function drawLineChart(svgId, points, unit, color){
    var svg = document.getElementById(svgId);
    var wrap = svg.parentNode;
    var old = wrap.querySelector(".chart-empty");
    if(old) wrap.removeChild(old);

    var valid = points.filter(function(p){ return p.value != null && !isNaN(p.value); });
    if(valid.length < 2){
      svg.style.display = "none";
      var msg = document.createElement("div");
      msg.className = "chart-empty";
      msg.textContent = valid.length === 0 ? "還沒有資料，先記一筆吧" : "再記一筆就能畫出趨勢囉";
      wrap.appendChild(msg);
      return;
    }
    svg.style.display = "block";

    var W = 320, H = 130, padL = 34, padR = 10, padT = 12, padB = 20;
    var vals = valid.map(function(p){ return p.value; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(max - min < 0.5){ min -= 0.5; max += 0.5; }
    var span = max - min;
    min -= span * 0.12; max += span * 0.12;

    function x(i){ return padL + (i/(valid.length-1)) * (W - padL - padR); }
    function y(v){ return padT + (1 - (v - min)/(max - min)) * (H - padT - padB); }

    var parts = [];
    parts.push('<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1"/>');
    parts.push('<text x="4" y="'+(padT+5)+'" font-size="9" fill="var(--muted)">'+(Math.round(max*10)/10)+'</text>');
    parts.push('<text x="4" y="'+(H-padB)+'" font-size="9" fill="var(--muted)">'+(Math.round(min*10)/10)+'</text>');

    var d = valid.map(function(p,i){ return (i===0?"M":"L") + x(i).toFixed(1) + "," + y(p.value).toFixed(1); }).join(" ");
    var areaD = d + " L" + x(valid.length-1).toFixed(1) + "," + (H-padB) + " L" + x(0).toFixed(1) + "," + (H-padB) + " Z";
    parts.push('<path d="'+areaD+'" fill="'+color+'" opacity="0.10"/>');
    parts.push('<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>');

    valid.forEach(function(p,i){
      parts.push('<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="3.2" fill="var(--card)" stroke="'+color+'" stroke-width="2"/>');
    });

    var first = valid[0].date.slice(5).replace("-","/");
    var last = valid[valid.length-1].date.slice(5).replace("-","/");
    parts.push('<text x="'+padL+'" y="'+(H-6)+'" font-size="9" fill="var(--muted)">'+first+'</text>');
    parts.push('<text x="'+(W-padR)+'" y="'+(H-6)+'" font-size="9" fill="var(--muted)" text-anchor="end">'+last+'</text>');

    svg.innerHTML = parts.join("");
  }

  function renderTrend(){
    var list = measuresSorted();

    var latestEl = document.getElementById("latestStat");
    var deltaEl = document.getElementById("statDelta");
    if(list.length === 0){
      latestEl.textContent = "—";
      deltaEl.textContent = "還沒記過體重體脂，按上面的按鈕開始";
    }else{
      var latest = list[list.length-1];
      var bits = [];
      if(latest.weight != null) bits.push(latest.weight + " kg");
      if(latest.fat != null) bits.push(latest.fat + "%");
      latestEl.textContent = bits.join(" · ") || "—";

      if(list.length >= 2){
        var prev = list[list.length-2];
        var msgs = [];
        if(latest.weight != null && prev.weight != null){
          var dw = Math.round((latest.weight - prev.weight)*10)/10;
          msgs.push(dw === 0 ? "體重持平" : (dw < 0 ? "體重少了 " + Math.abs(dw) + " kg" : "體重多了 " + dw + " kg"));
        }
        if(latest.fat != null && prev.fat != null){
          var df = Math.round((latest.fat - prev.fat)*10)/10;
          msgs.push(df === 0 ? "體脂持平" : (df < 0 ? "體脂降了 " + Math.abs(df) + "%" : "體脂升了 " + df + "%"));
        }
        deltaEl.textContent = msgs.length ? "跟上次比，" + msgs.join("、") : "";
      }else{
        deltaEl.textContent = "再記幾次就能看出趨勢了";
      }
    }

    drawLineChart("weightChart", list.map(function(m){ return {date:m.date, value:m.weight}; }), "kg", "var(--ink)");
    drawLineChart("fatChart", list.map(function(m){ return {date:m.date, value:m.fat}; }), "%", "var(--alert)");

    renderWeekSummary();
  }

  function renderWeekSummary(){
    var all = loadEntries();
    var limit = getSugarLimit();
    var goal = getProteinGoal();
    var container = document.getElementById("weekSummary");
    var rows = [];
    var d = new Date();
    for(var i = 0; i < 7; i++){
      var key = dateKeyFromDateObj(d);
      var dayEntries = all[key] || [];
      var sugar = dayEntries.reduce(function(s,e){ return s + (Number(e.sugar_g)||0); }, 0);
      var protein = dayEntries.reduce(function(s,e){ return s + (Number(e.protein_g)||0); }, 0);
      var wk = ["日","一","二","三","四","五","六"][d.getDay()];
      var label = (i === 0 ? "今天" : (d.getMonth()+1) + "/" + d.getDate() + " 週" + wk);
      rows.push({
        label: label,
        has: dayEntries.length > 0,
        sugar: Math.round(sugar*10)/10,
        protein: Math.round(protein*10)/10,
        over: sugar > limit,
        hitProtein: protein >= goal
      });
      d.setDate(d.getDate() - 1);
    }
    container.innerHTML = rows.map(function(r){
      var vals = r.has
        ? "糖 " + r.sugar + "g · 蛋 " + r.protein + "g" + (r.hitProtein ? " 💪" : "")
        : "沒有紀錄";
      return '<div class="week-row' + (r.over ? " over" : "") + '">' +
        '<span class="day">' + r.label + '</span>' +
        '<span class="vals">' + vals + '</span>' +
      '</div>';
    }).join("");
  }

  function renderHistory(){
    var key = document.getElementById("historyDate").value;
    var container = document.getElementById("historyList");
    if(!key){
      container.innerHTML = '<div class="empty-state">選一個日期看看那天吃了什麼</div>';
      return;
    }
    var all = loadEntries();
    var entries = all[key] || [];
    if(entries.length === 0){
      container.innerHTML = '<div class="empty-state">這天沒有紀錄</div>';
      return;
    }
    var sugar = entries.reduce(function(s,e){ return s + (Number(e.sugar_g)||0); }, 0);
    var protein = entries.reduce(function(s,e){ return s + (Number(e.protein_g)||0); }, 0);
    container.innerHTML =
      '<div class="week-row"><span class="day">這天合計</span><span class="vals">糖 ' +
      (Math.round(sugar*10)/10) + 'g · 蛋 ' + (Math.round(protein*10)/10) + 'g</span></div>' +
      entries.map(function(e){
        return '<div class="entry' + (Number(e.sugar_g) >= 10 ? " high-sugar" : "") + '">' +
          '<div class="meta">' +
            '<div class="food">' + escapeHtml(e.food_name) + '</div>' +
            '<div class="time">' + e.time + (e.note ? " · " + escapeHtml(e.note) : "") + '</div>' +
          '</div>' +
          '<div class="stats">' +
            '<div class="kcal num">' + (e.calories!=null ? e.calories + " kcal" : "—") + '</div>' +
            '<div class="num">蛋 ' + (e.protein_g!=null ? e.protein_g + "g" : "—") + ' · 糖 ' + (e.sugar_g!=null ? e.sugar_g + "g" : "—") + '</div>' +
          '</div>' +
        '</div>';
      }).join("");
  }

  document.getElementById("historyDate").addEventListener("change", renderHistory);

  document.getElementById("addMeasureBtn").addEventListener("click", function(){
    var today = dateKeyFromDateObj(new Date());
    var existing = loadMeasures()[today] || {};
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.innerHTML =
      '<h2>記錄體重體脂</h2>' +
      '<div class="field"><label>日期</label><input type="date" id="mf_date" value="' + today + '"></div>' +
      '<div class="field"><label>體重（kg）</label><input type="number" step="0.1" id="mf_weight" value="' + (existing.weight != null ? existing.weight : "") + '"></div>' +
      '<div class="field"><label>體脂率（%）</label><input type="number" step="0.1" id="mf_fat" value="' + (existing.fat != null ? existing.fat : "") + '"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn ghost" id="mf_cancel">取消</button>' +
        '<button class="btn primary" id="mf_save">儲存</button>' +
      '</div>';
    overlay.innerHTML = "";
    overlay.appendChild(sheet);
    overlay.classList.add("show");

    document.getElementById("mf_cancel").addEventListener("click", function(){
      overlay.classList.remove("show");
    });
    document.getElementById("mf_save").addEventListener("click", function(){
      var dateVal = document.getElementById("mf_date").value || today;
      var w = numOrNull(document.getElementById("mf_weight").value);
      var f = numOrNull(document.getElementById("mf_fat").value);
      if(w == null && f == null){
        alert("至少填一個數字吧");
        return;
      }
      saveMeasure(dateVal, w, f);
      overlay.classList.remove("show");
      renderTrend();
      showToast("📏 量測記好了");
    });
  });

  // ---------- init ----------
  renderDate();
  renderSugar();
  renderProtein();
  renderBadges();
  renderEntries();
  loadSettingsForm();
  renderColorStrip();
  renderTrend();
  renderHistory();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
